[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repocache-control"
version = "0.4.0"
description = "REPOCACHE Linux repository management"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["typer>=0.12,<1", "rich>=13,<16", "textual>=0.80,<10"]

[project.scripts]
repocache = "repocache.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
