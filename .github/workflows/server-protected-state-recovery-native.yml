name: Server Protected State Crash Recovery (Distro Containers)

on:
  pull_request:
    paths:
      - '.github/workflows/server-protected-state-recovery-native.yml'
      - 'src/repocache/server_proposed_state_v2_store.py'
      - 'src/repocache/server_protected_state_store_v1.py'
      - 'src/repocache/server_locked_manifest_reconcile_v1.py'
      - 'src/repocache/server_protected_state_inspect_v1.py'
      - 'tests/test_server_proposed_state_v2_store.py'
      - 'tests/test_server_protected_state_store_v1.py'
      - 'tests/test_server_locked_manifest_reconcile_v1.py'
      - 'docs/architecture/SERVER_LOCKED_MANIFEST_RECONCILIATION_V1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/server-protected-state-recovery-native.yml'
      - 'src/repocache/server_proposed_state_v2_store.py'
      - 'src/repocache/server_protected_state_store_v1.py'
      - 'src/repocache/server_locked_manifest_reconcile_v1.py'
      - 'tests/test_server_proposed_state_v2_store.py'
      - 'tests/test_server_protected_state_store_v1.py'
      - 'tests/test_server_locked_manifest_reconcile_v1.py'

permissions:
  contents: read

jobs:
  protected-state-process-crash:
    name: Locked journal and separate-PID rollback (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:trixie-slim
          - platform: almalinux10
            image: almalinux:10
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install distro-native Python/pytest inside disposable container
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ '${{ matrix.platform }}' = 'debian13' ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3 python3-pytest nginx openssl ca-certificates
          else
            dnf -y -q --enablerepo=crb install python3 python3-pytest nginx openssl ca-certificates
          fi
          python3 --version
          python3 -m pytest --version
          nginx -v
      - name: Verify supported OS/Python identity without host authority
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import os
          import sys
          from pathlib import Path
          from repocache.server_install_v1 import validate_os_identity
          targets = {
              "debian13": ("debian", (3, 13)),
              "almalinux10": ("almalinux", (3, 12)),
          }
          name, version = targets[os.environ["EXPECTED_PLATFORM"]]
          assert sys.version_info[:2] == version
          assert validate_os_identity(
              Path("/etc/os-release").read_text(encoding="utf-8"),
              sys.version_info[:2],
          ) == name
          print("PASS: distro userspace identity; no host authorizations")
          PY
      - name: Exercise v1/v2 locks, real process exit, journal and recovery
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          python3 -B -m pytest -q -rs \
            tests/test_server_protected_state_store_v1.py \
            tests/test_server_locked_manifest_reconcile_v1.py \
            tests/test_server_proposed_state_v2_store.py
          # Linux fixture evidence only, not booted native systemd/SELinux,
          # real NGINX service recovery, or privileged host installation.
