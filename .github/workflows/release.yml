name: Release bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test requirements
        run: python -m pip install -e . pytest
      - name: Run unit and Textual integration tests
        run: python -m pytest -q

  release-bundle-smoke:
    name: Bundle integrity and unsigned-install refusal (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ['debian13', 'almalinux10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Build the release archive and checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/build_release.py --tag "$TAG" --output dist
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Verify bundle integrity and reject unsigned source in Docker
        shell: bash
        run: bash scripts/smoke_release_bundle.sh "$RELEASE_TAG" '${{ matrix.platform }}' dist

  assemble:
    name: Build candidate without publisher authority
    needs: [unit-tests, release-bundle-smoke]
    if: startsWith(github.ref, 'refs/tags/v') && github.actor == 'teixemf'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Gate manual tag publication against main ancestry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == refs/tags/v* && "$GITHUB_ACTOR" == teixemf ]] || { echo "Manual owner-approved version tag required." >&2; exit 1; }
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main" --jq '.status')"
          # Compare API is BASE(tag)...HEAD(main): "ahead" means main
          # contains the tag commit. "behind" would permit unmerged code.
          case "$status" in
            ahead|identical) ;;
            *) echo 'ERROR: Release commit is not an ancestor of main.' >&2; exit 1 ;;
          esac
      - name: Build verified release artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG="v${VERSION}"
          if [[ "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "ERROR: Git tag $GITHUB_REF_NAME does not match project version $TAG." >&2
            exit 1
          fi
          python scripts/build_release.py --tag "$TAG" --output dist
          (cd dist && sha256sum -c "repocache-${TAG}.tar.gz.sha256") || {
            echo 'ERROR: Release checksum verification failed.' >&2
            exit 1
          }
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Build and validate hash-pinned runtime wheels without network on targets
        shell: bash
        run: bash scripts/build_release_wheels.sh dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unsigned-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 7

