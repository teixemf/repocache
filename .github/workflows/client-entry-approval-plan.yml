name: Client Entry Approval Plan Native

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entry-approval:
    name: Explicit root approval and byte-only preview (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:trixie-slim', 'almalinux:10']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      # The staging implementation is deliberately NOT copied into this PR.
      # Pin unmerged #131 by immutable Git SHA for reproducible integration.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ddb0ab522e31a91c4026fb9a7c839c86fd25d78b
          path: _transaction_dependency
          persist-credentials: false
      - name: Test guarded approval and sibling preservation with native Python
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network bridge \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --workdir /workspace '${{ matrix.image }}' \
            sh -ec '
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update -qq
                apt-get install -y --no-install-recommends python3 >/dev/null
              else
                dnf install -y python3 >/dev/null
              fi
              python3 scripts/smoke_client_entry_approval_plan.py
              python3 scripts/smoke_client_entry_stage.py
            '
