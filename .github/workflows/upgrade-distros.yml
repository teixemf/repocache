name: Debian 13 and AlmaLinux 10 upgrade rehearsal

on:
  # Required on every PR: path-filtered workflows omit mandatory security
  # contexts for tests/docs-only changes and weaken pre-merge acceptance.
  pull_request:
  push:
    branches: [main, release/v0.4.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-release-upgrade:
    name: Synthetic rootless update and rollback (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:trixie-slim', 'almalinux:10']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Exercise synthetic rootless install and rollback (NOT published v0.3.0 migration)
        shell: bash
        run: bash scripts/smoke_upgrade_distros.sh '${{ matrix.image }}'
