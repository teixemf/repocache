name: Issue label colors

on:
  pull_request:
    paths:
      - .github/labels.json
      - .github/scripts/sync_labels.py
      - .github/workflows/label-colors.yml
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/scripts/sync_labels.py
      - .github/workflows/label-colors.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python .github/scripts/sync_labels.py

  sync-colors:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Apply label palette
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/sync_labels.py --apply
