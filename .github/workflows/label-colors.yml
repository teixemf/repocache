name: Issue label colors

on:
  pull_request:
    paths:
      - .github/labels.json
      - .github/scripts/sync_labels.py
      - .github/workflows/label-colors.yml
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/scripts/sync_labels.py
      - .github/workflows/label-colors.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python .github/scripts/sync_labels.py

  sync-colors:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Apply label palette
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/sync_labels.py --apply
