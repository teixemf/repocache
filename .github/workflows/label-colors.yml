name: Issue label colors

on:
  pull_request:
    paths:
      - .github/labels.json
      - .github/scripts/sync_labels.py
      - .github/workflows/label-colors.yml
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/scripts/sync_labels.py
      - .github/workflows/label-colors.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python .github/scripts/sync_labels.py

  sync-colors:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Apply label palette
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/sync_labels.py --apply
