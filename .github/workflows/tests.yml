name: Tests

on:
  push:
    branches: [main, release/v0.4.0]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test requirements
        run: python -m pip install -e . pytest
      - name: Run unit and Textual integration tests
        run: python -m pytest -q

  release-bundle-smoke:
    name: Bundle install (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ['debian13', 'almalinux10']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build the exact release asset
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/build_release.py --tag "$TAG" --output dist
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Verify bundle, install and launch Textual in Docker
        shell: bash
        run: bash scripts/smoke_release_bundle.sh "$RELEASE_TAG" '${{ matrix.platform }}' dist
