name: Tests

on:
  push:
    branches: [main, release/v0.4.0]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test requirements
        run: python -m pip install -e . pytest
      - name: Run unit and Textual integration tests
        run: python -m pytest -q
      # Required contract gate: any unreviewed public command/alias addition
      # fails the protected Python 3.12/3.13 CI matrix. Future grammar changes
      # require updating the reviewed inventory and the behavioral tests.
      - name: Required CLI Architecture v1 conformance gate (#107)
        run: |
          python -m pytest -q \
            tests/test_cli_interface_contract.py \
            tests/test_cli_error_contract.py
      # Explicit required step: missing/renamed defensive test modules fail CI
      # rather than becoming an accidentally omitted pytest discovery case.
      - name: Required release security regression gate (issues 37 38 39)
        run: |
          python -m pytest -q \
            tests/test_public_release_transport_defensive.py \
            tests/test_hostile_archive_defensive.py \
            tests/test_complete_bundle_identity.py \
            tests/test_release_integration_contract.py

  release-bundle-smoke:
    name: Bundle integrity and unsigned-source refusal (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ['debian13', 'almalinux10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Build the exact release asset
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/build_release.py --tag "$TAG" --output dist
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Verify bundle, reject unsigned source and exercise client in Docker
        shell: bash
        run: bash scripts/smoke_release_bundle.sh "$RELEASE_TAG" '${{ matrix.platform }}' dist
      - name: Rehearse Node.js 24 artifact upload without publishing (#74)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: node24-rehearsal-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
